packages:
  - 'apps/*'
  - 'packages/*'

# Exact versions only (D-03): `pnpm add` saves without ^/~
savePrefix: ''

# Supply-chain guard: never install a version published less than 7 days ago
minimumReleaseAge: 10080

# Only these packages may run install scripts
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  '@sentry/cli': true
  cpu-features: false
  ssh2: false
  protobufjs: false
