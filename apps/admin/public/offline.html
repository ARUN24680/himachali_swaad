<!doctype html>
<html lang="hi-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Offline — Pahadi Khatki Packing Desk</title>
    <!--
      Last-resort fallback served by the service worker when neither the network nor the cached app
      shell is available (Phase 7 §7.2). It must work with zero other files, so it carries a tiny
      style block and uses CSS system colours (Canvas / CanvasText / GrayText) instead of literals.
    -->
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      main {
        max-width: 22rem;
        display: grid;
        gap: 12px;
      }
      h1 {
        font-size: 1.375rem;
        margin: 0;
      }
      p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.5;
      }
      .muted {
        color: GrayText;
      }
      button {
        min-height: 48px;
        font: inherit;
        font-weight: 600;
        border-radius: 10px;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>📶 Internet nahi hai</h1>
      <p>Packing Desk khulne ke liye ek baar internet chahiye. Connection aate hi dobara kholein.</p>
      <p class="muted" lang="en">You’re offline. Open the Packing Desk again once you’re connected.</p>
      <button type="button" onclick="location.reload()">Dobara kholein · Retry</button>
    </main>
  </body>
</html>
