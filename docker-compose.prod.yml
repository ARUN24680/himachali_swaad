# Full Docker stack for Pahadi Khatki (local defaults; production needs real providers + HTTPS)
# Stack: PostgreSQL 17 + Redis 7 + Auto-Migrations + Fastify API + BullMQ Worker + Next.js Storefront + Admin SPA + S3 Glacier Backup + Nginx
name: pahadi-khatki-prod

services:
  # 1. Primary PostgreSQL 17 Database
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pk_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-pahadi_khatki}
      TZ: UTC
    ports:
      # Configurable host port (default 5435 avoids clash with existing local postgres)
      - '${HOST_DB_PORT:-127.0.0.1:5435}:5432'
    volumes:
      - pk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pk} -d ${POSTGRES_DB:-pahadi_khatki}']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 2. Redis 7.4 (Queues, rate-limits, sessions with AOF persistence)
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${HOST_REDIS_PORT:-127.0.0.1:6381}:6379'
    volumes:
      - pk_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 3. Automatic DB Migrations on startup (dbmate)
  migrate:
    image: amacneil/dbmate:2.36.0
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pk}:${POSTGRES_PASSWORD:-pk_local_only}@postgres:5432/${POSTGRES_DB:-pahadi_khatki}?sslmode=disable
    volumes:
      - ./packages/database/migrations:/db/migrations
    command: --migrations-dir /db/migrations --no-dump-schema up
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

  # 4. Fastify HTTP API Backend (:4000)
  backend-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: ['node', 'dist/server.js']
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      HOST: 0.0.0.0
      # nginx is the only path to the API (host ports are loopback-only), so the X-Forwarded-For it sets
      # is the real client IP. Without this every visitor shares one rate-limit bucket (audit M-2).
      TRUST_PROXY: ${TRUST_PROXY:-true}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080,http://127.0.0.1:8080}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      DATABASE_URL: postgres://${POSTGRES_USER:-pk}:${POSTGRES_PASSWORD:-pk_local_only}@postgres:5432/${POSTGRES_DB:-pahadi_khatki}?sslmode=disable
      REDIS_URL: redis://redis:6379
      API_PUBLIC_URL: ${DOCKER_API_PUBLIC_URL:-http://localhost:4001}
      API_INTERNAL_URL: http://backend-api:4000
      STOREFRONT_REVALIDATE_URL: ${DOCKER_REVALIDATE_URL:-}
      LOCAL_UPLOADS_DIR: /app/.uploads
      LOCAL_PRIVATE_UPLOADS_DIR: /app/.uploads-private
      DEFAULT_OTP: ${DEFAULT_OTP:-}
    volumes:
      - ./apps/backend/.uploads:/app/.uploads
      - ./apps/backend/.uploads-private:/app/.uploads-private
    ports:
      - '${HOST_API_PORT:-127.0.0.1:4001}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/readyz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 5. BullMQ Background Worker (Shiprocket, orders, WhatsApp, reconciliation)
  backend-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PROCESS_NAME: pk-worker
      DATABASE_URL: postgres://${POSTGRES_USER:-pk}:${POSTGRES_PASSWORD:-pk_local_only}@postgres:5432/${POSTGRES_DB:-pahadi_khatki}?sslmode=disable
      REDIS_URL: redis://redis:6379
      API_PUBLIC_URL: ${DOCKER_API_PUBLIC_URL:-http://localhost:4001}
      API_INTERNAL_URL: http://backend-api:4000
      STOREFRONT_REVALIDATE_URL: ${DOCKER_REVALIDATE_URL:-}
      LOCAL_UPLOADS_DIR: /app/.uploads
      LOCAL_PRIVATE_UPLOADS_DIR: /app/.uploads-private
    volumes:
      - ./apps/backend/.uploads:/app/.uploads
      - ./apps/backend/.uploads-private:/app/.uploads-private
    depends_on:
      backend-api:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 6. Customer Next.js Storefront (:3000)
  storefront:
    build:
      context: .
      dockerfile: docker/Dockerfile.storefront
      args:
        NEXT_PUBLIC_API_URL: ${DOCKER_BROWSER_API_URL:-}
        NEXT_PUBLIC_SITE_URL: ${DOCKER_STOREFRONT_URL:-http://localhost:3001}
        # STORAGE_DRIVER=s3: set DOCKER_ASSETS_BASE_URL=https://<bucket>.s3.<region>.amazonaws.com (D-58)
        NEXT_PUBLIC_ASSETS_BASE_URL: ${DOCKER_ASSETS_BASE_URL:-${DOCKER_API_PUBLIC_URL:-http://localhost:4001}/dev-assets}
        INTERNAL_API_URL: http://backend-api:4000
        # Seller / legal / policy / social facts are compiled into the storefront (audit R-1, M-5).
        # Blank = visible "Pending" marker on the site. Rebuild + redeploy the storefront after changing them.
        NEXT_PUBLIC_SELLER_LEGAL_NAME: ${NEXT_PUBLIC_SELLER_LEGAL_NAME:-}
        NEXT_PUBLIC_SELLER_ADDRESS: ${NEXT_PUBLIC_SELLER_ADDRESS:-}
        NEXT_PUBLIC_SELLER_FSSAI_NO: ${NEXT_PUBLIC_SELLER_FSSAI_NO:-}
        NEXT_PUBLIC_SELLER_GSTIN: ${NEXT_PUBLIC_SELLER_GSTIN:-}
        NEXT_PUBLIC_SELLER_PHONE: ${NEXT_PUBLIC_SELLER_PHONE:-}
        NEXT_PUBLIC_SELLER_EMAIL: ${NEXT_PUBLIC_SELLER_EMAIL:-}
        NEXT_PUBLIC_SELLER_WHATSAPP: ${NEXT_PUBLIC_SELLER_WHATSAPP:-}
        NEXT_PUBLIC_SELLER_SUPPORT_HOURS: ${NEXT_PUBLIC_SELLER_SUPPORT_HOURS:-}
        NEXT_PUBLIC_SELLER_GRIEVANCE_NAME: ${NEXT_PUBLIC_SELLER_GRIEVANCE_NAME:-}
        NEXT_PUBLIC_SELLER_GRIEVANCE_DESIGNATION: ${NEXT_PUBLIC_SELLER_GRIEVANCE_DESIGNATION:-}
        NEXT_PUBLIC_SELLER_GRIEVANCE_EMAIL: ${NEXT_PUBLIC_SELLER_GRIEVANCE_EMAIL:-}
        NEXT_PUBLIC_SELLER_GRIEVANCE_PHONE: ${NEXT_PUBLIC_SELLER_GRIEVANCE_PHONE:-}
        NEXT_PUBLIC_POLICY_FREE_SHIPPING: ${NEXT_PUBLIC_POLICY_FREE_SHIPPING:-}
        NEXT_PUBLIC_POLICY_RTO_REFUND: ${NEXT_PUBLIC_POLICY_RTO_REFUND:-}
        NEXT_PUBLIC_POLICY_DAMAGE_CLAIM_WINDOW: ${NEXT_PUBLIC_POLICY_DAMAGE_CLAIM_WINDOW:-}
        NEXT_PUBLIC_POLICY_DAMAGE_EVIDENCE: ${NEXT_PUBLIC_POLICY_DAMAGE_EVIDENCE:-}
        NEXT_PUBLIC_POLICY_REFUND_TIMELINE: ${NEXT_PUBLIC_POLICY_REFUND_TIMELINE:-}
        NEXT_PUBLIC_POLICY_LAST_UPDATED: ${NEXT_PUBLIC_POLICY_LAST_UPDATED:-}
        NEXT_PUBLIC_SOCIAL_INSTAGRAM_URL: ${NEXT_PUBLIC_SOCIAL_INSTAGRAM_URL:-}
        NEXT_PUBLIC_SOCIAL_FACEBOOK_URL: ${NEXT_PUBLIC_SOCIAL_FACEBOOK_URL:-}
        NEXT_PUBLIC_SOCIAL_YOUTUBE_URL: ${NEXT_PUBLIC_SOCIAL_YOUTUBE_URL:-}
        NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://backend-api:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      # Pre-launch lock: only /coming-soon is public until this is `live` (apps/storefront/src/lib/launch-mode.ts)
      LAUNCH_MODE: ${LAUNCH_MODE:-coming-soon}
    ports:
      - '${HOST_STOREFRONT_PORT:-127.0.0.1:3001}:3000'
    depends_on:
      backend-api:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 7. Admin & Kitchen Partner PWA (:5173 / :80)
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        VITE_API_URL: ${DOCKER_BROWSER_API_URL:-}
        # Pre-launch lock: the build shows only a 404 until this is `live` (apps/admin/src/lib/launch-mode.ts)
        VITE_LAUNCH_MODE: ${VITE_LAUNCH_MODE:-live}
        # ADMIN idle auto-logout (minutes, audit R-12); the API enforces the same limit on refresh
        VITE_ADMIN_IDLE_MINUTES: ${ADMIN_IDLE_TIMEOUT_MIN:-30}
    restart: unless-stopped
    ports:
      - '${HOST_ADMIN_PORT:-127.0.0.1:5174}:80'
    depends_on:
      backend-api:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 8. Automated Daily S3 Glacier Backup (10-Year Safe Vault)
  backup-service:
    profiles: ['backup']
    build:
      context: .
      dockerfile: docker/Dockerfile.backup
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-pk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pk_local_only}
      DB_NAME: ${POSTGRES_DB:-pahadi_khatki}
      S3_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_PREFIX: postgres-backups
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

  # 9. Master Nginx Reverse Proxy (SSL & Domain Routing)
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      # Rendered into /etc/nginx/conf.d/default.conf at start (docker/nginx/templates). Recreate to apply.
      STAGING_HTTPS: ${STAGING_HTTPS:-off}
      LAUNCH_MODE: ${LAUNCH_MODE:-coming-soon}
      NGINX_ENVSUBST_FILTER: ^(STAGING_HTTPS|LAUNCH_MODE)$$
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      # Server-local admin IP allow-list (optional) — see docker/nginx/snippets/admin-allowlist.conf
      - ${ADMIN_ALLOWLIST_FILE:-./docker/nginx/snippets/admin-allowlist.conf}:/etc/nginx/snippets/admin-allowlist.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # certbot --webroot writes ACME challenges here (docs/ops/staging-https.md)
      - ${CERTBOT_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
    depends_on:
      - backend-api
      - storefront
      - admin
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # 10. Direct UPI payment service (D-59) — opt-in: `--profile direct-upi`. Own database pk_payment.
  #     Removing it = delete this block + apps/payment + docker/Dockerfile.payment.
  payment-migrate:
    profiles: ['direct-upi']
    image: amacneil/dbmate:2.36.0
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pk}:${POSTGRES_PASSWORD:-pk_local_only}@postgres:5432/pk_payment?sslmode=disable
    volumes:
      - ./apps/payment/migrations:/db/migrations
    # `create` is a no-op when the database exists
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'dbmate --migrations-dir /db/migrations --no-dump-schema create && dbmate --migrations-dir /db/migrations --no-dump-schema up',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  payment:
    profiles: ['direct-upi']
    build:
      context: .
      dockerfile: docker/Dockerfile.payment
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PAYMENT_PORT: 4100
      PAYMENT_HOST: 0.0.0.0
      PAYMENT_DATABASE_URL: postgres://${POSTGRES_USER:-pk}:${POSTGRES_PASSWORD:-pk_local_only}@postgres:5432/pk_payment?sslmode=disable
      PAYMENT_WEBHOOK_URL: ${PAYMENT_WEBHOOK_URL:-http://backend-api:4000/api/v1/webhooks/razorpay}
    ports:
      - '${HOST_PAYMENT_PORT:-127.0.0.1:4101}:4100'
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pk_pgdata:
  pk_redisdata:
    name: ${DOCKER_REDIS_VOLUME:-pahadi-khatki-prod_pk_redisdata}
