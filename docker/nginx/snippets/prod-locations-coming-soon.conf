# LAUNCH_MODE=coming-soon (D-61): only the teaser and its assets are served; everything else → /coming-soon.
# The storefront's own proxy applies the same lock (defence in depth); keep both in sync on launch day.
location = / { return 302 /coming-soon; }

location ~ ^/(coming-soon|_next|teaser|icon\.svg|robots\.txt|robots-noindex\.txt|favicon\.ico|\.well-known/security\.txt) {
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/tls-headers.conf;
    proxy_pass http://storefront_service;
}

location / {
    include /etc/nginx/snippets/tls-headers.conf;
    return 302 /coming-soon;
}
