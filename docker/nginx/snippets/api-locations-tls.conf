# api-locations.conf + HSTS per location (HTTPS server blocks).
location /api/v1/auth/ {
    limit_req zone=pk_auth burst=20 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/tls-headers.conf;
    proxy_pass http://backend_service;
}
location /api/ {
    limit_req zone=pk_api burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/tls-headers.conf;
    proxy_pass http://backend_service;
}
location /dev-assets/ {
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/tls-headers.conf;
    proxy_pass http://backend_service;
}
