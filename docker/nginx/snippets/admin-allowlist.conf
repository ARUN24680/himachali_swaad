# Optional IP allow-list for the admin + packing-desk SPA (audit §4 "IP whitelist ya VPN").
# Default: open (the API still enforces login + ADMIN TOTP). To restrict, point ADMIN_ALLOWLIST_FILE in
# .env at a server-local copy of this file containing e.g.
#   allow 203.0.113.10;      # office
#   allow 198.51.100.0/24;   # VPN range
#   deny  all;
# and recreate the nginx container. Kitchen partners on mobile data need their range or a VPN.
allow all;
