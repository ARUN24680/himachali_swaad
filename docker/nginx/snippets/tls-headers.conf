# HSTS on every TLS response (2 years, preload-ready — audit R-9). The upstream may also send it
# (Next.js when built with an https site URL); hide that copy so exactly one header goes out.
# NOTE: nginx `add_header` is per-block — include this in every location of an HTTPS server.
proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
