# Staging host: full store + admin, never indexed. Included by the HTTP (off) and HTTPS (on) blocks.
client_max_body_size 25M;

location = /robots.txt { add_header X-Robots-Tag "noindex, nofollow, noarchive" always; return 200 "User-agent: *\nDisallow: /\n"; }

include /etc/nginx/snippets/api-locations.conf;

location = /admin { return 301 /admin/; }
location /admin/ {
    include /etc/nginx/snippets/admin-allowlist.conf;
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/noindex-headers.conf;
    proxy_pass http://admin_service/;
}

location / {
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/noindex-headers.conf;
    proxy_pass http://storefront_service;
}
