# Same as staging-locations.conf plus HSTS in every location (nginx add_header is per block).
client_max_body_size 25M;

location = /robots.txt {
    include /etc/nginx/snippets/tls-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 200 "User-agent: *\nDisallow: /\n";
}

location /api/v1/auth/ {
    limit_req zone=pk_auth burst=20 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/tls-headers.conf;
    proxy_pass http://backend_service;
}
location /api/ {
    limit_req zone=pk_api burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/tls-headers.conf;
    proxy_pass http://backend_service;
}
location /dev-assets/ {
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/tls-headers.conf;
    proxy_pass http://backend_service;
}

location = /admin { return 301 /admin/; }
location /admin/ {
    include /etc/nginx/snippets/admin-allowlist.conf;
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/tls-headers.conf;
    include /etc/nginx/snippets/noindex-headers.conf;
    proxy_pass http://admin_service/;
}

location / {
    include /etc/nginx/snippets/proxy-common.conf;
    include /etc/nginx/snippets/tls-headers.conf;
    include /etc/nginx/snippets/noindex-headers.conf;
    proxy_pass http://storefront_service;
}
