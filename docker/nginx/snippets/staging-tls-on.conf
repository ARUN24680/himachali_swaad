# STAGING_HTTPS=on: staging over TLS. The certificate is the production one, expanded to include
# staging.pahadikhatki.in as a SAN (same file paths, so nginx starts even before the expansion).
server {
    listen 443 ssl;
    http2 on;
    server_name staging.pahadikhatki.in;

    ssl_certificate     /etc/letsencrypt/live/pahadikhatki.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pahadikhatki.in/privkey.pem;
    include /etc/nginx/snippets/tls-params.conf;

    location = /healthz { access_log off; return 200 "healthy\n"; }

    # HSTS applies inside every location below — tls-headers.conf is included per location
    include /etc/nginx/snippets/staging-locations-tls.conf;
}
