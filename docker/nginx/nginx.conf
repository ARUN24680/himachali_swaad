user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstream services inside Docker network
    upstream storefront_service {
        server storefront:3000;
    }

    upstream backend_service {
        server backend-api:4000;
    }

    upstream admin_service {
        server admin:80;
    }

    server {
        listen 80;
        server_name _;

        # Healthcheck endpoint for AWS ALB or uptime monitors
        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }

        # API routing (/api/...)
        location /api/v1/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        location /dev-assets/ {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
        }

        # Storefront routing (Pre-launch lock: ONLY /coming-soon is accessible)
        location = / {
            return 302 /coming-soon;
        }

        # Allow coming-soon page, Next.js assets, teaser images, and icons
        location ~ ^/(coming-soon|_next|teaser|icon\.svg|robots\.txt|favicon\.ico) {
            proxy_pass http://storefront_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Everything else redirects to /coming-soon
        location / {
            return 302 /coming-soon;
        }
    }
}
