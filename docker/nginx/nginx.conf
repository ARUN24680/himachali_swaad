user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstream services inside Docker network
    upstream storefront_service {
        server storefront:3000;
    }

    upstream backend_service {
        server backend-api:4000;
    }

    upstream admin_service {
        server admin:80;
    }

    # ========================================================
    # 1. STAGING ENVIRONMENT (Full E-Commerce App - NO LOCK)
    # ========================================================
    server {
        listen 80;
        server_name staging.pahadikhatki.in;

        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }

        # API routing
        location /api/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /dev-assets/ {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Admin & Kitchen Desk
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            proxy_pass http://admin_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Full Storefront (All products, cart, checkout)
        location / {
            proxy_pass http://storefront_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ========================================================
    # 2. PUBLIC SITE HTTP -> HTTPS Redirect
    # ========================================================
    server {
        listen 80;
        server_name pahadikhatki.in www.pahadikhatki.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ========================================================
    # 3. PUBLIC SITE HTTPS (Pre-launch Coming Soon Lock)
    # ========================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name pahadikhatki.in www.pahadikhatki.in;

        ssl_certificate /etc/letsencrypt/live/pahadikhatki.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pahadikhatki.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Healthcheck endpoint
        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }

        # API routing
        location /api/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        location /dev-assets/ {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Storefront routing (Pre-launch lock: ONLY /coming-soon is accessible)
        location = / {
            return 302 /coming-soon;
        }

        # Allow coming-soon page, Next.js assets, teaser images, and icons
        location ~ ^/(coming-soon|_next|teaser|icon\.svg|robots\.txt|favicon\.ico) {
            proxy_pass http://storefront_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Everything else redirects to /coming-soon
        location / {
            return 302 /coming-soon;
        }
    }

    # ========================================================
    # 4. DEFAULT CATCH-ALL (Any raw IP access)
    # ========================================================
    server {
        listen 80 default_server;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "healthy\n";
        }

        location / {
            return 302 http://staging.pahadikhatki.in$request_uri;
        }
    }
}
