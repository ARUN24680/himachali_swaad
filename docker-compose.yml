name: pahadi-khatki

services:
  # ==========================================
  # 1. DATABASE: PostgreSQL 17
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pk
      POSTGRES_PASSWORD: pk_local_only
      POSTGRES_DB: pahadi_khatki
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pk -d pahadi_khatki']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 300M

  # ==========================================
  # 2. CACHE & QUEUE: Redis 7.4
  # ==========================================
  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '80mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - pk_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 80M

  # ==========================================
  # 3. BACKEND API: Fastify Server (:4000)
  # ==========================================
  backend-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: backend-api
    restart: unless-stopped
    command: ['node', '--max-old-space-size=280', 'dist/server.js']
    env_file:
      - .env
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://pk:pk_local_only@postgres:5432/pahadi_khatki
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 350M

  # ==========================================
  # 4. BACKGROUND WORKER: BullMQ
  # ==========================================
  backend-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: backend-worker
    restart: unless-stopped
    command: ['node', '--max-old-space-size=160', 'dist/worker.js']
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://pk:pk_local_only@postgres:5432/pahadi_khatki
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 200M

  # ==========================================
  # 5. CUSTOMER STOREFRONT: Next.js 15 (:3000)
  # ==========================================
  storefront:
    build:
      context: .
      dockerfile: docker/Dockerfile.storefront
    container_name: storefront
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: '--max-old-space-size=320'
      INTERNAL_API_URL: http://backend-api:4000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - backend-api
    deploy:
      resources:
        limits:
          memory: 400M

  # ==========================================
  # 6. ADMIN PORTAL: React / Vite Dashboard (:5173 / :80)
  # ==========================================
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: admin
    restart: unless-stopped
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      - backend-api
    deploy:
      resources:
        limits:
          memory: 60M

  # ==========================================
  # 7. MASTER REVERSE PROXY: Nginx (:80 & :443)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend-api
      - storefront
      - admin
    deploy:
      resources:
        limits:
          memory: 40M

volumes:
  pk_pgdata:
  pk_redisdata:
